services:
  mysql:
    image: mysql:8.4
    container_name: mysql-fastify
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: escola

    ports:
      - "3307:3306"

    volumes:
      - mysql_fastify_data:/var/lib/mysql

volumes:
  mysql_fastify_data: